<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente administrativo</title>
<style>
  :root { --fondo:#f6f7f9; --panel:#fff; --texto:#1f2430; --suave:#667085; --borde:#e3e6eb; --acento:#1d4ed8; --ok:#15803d; --error:#b42318; --aviso:#b54708; --aviso-fondo:#fff7e6; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--fondo); color:var(--texto); display:flex; flex-direction:column; height:100vh }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--borde); display:flex; justify-content:space-between; align-items:center; gap:12px }
  header h1 { font-size:16px; margin:0 }
  #estado { font-size:12px; color:var(--suave) }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:900px; width:100%; margin:0 auto }
  .msg { padding:10px 14px; border-radius:10px; white-space:pre-wrap; max-width:85% }
  .usuario { align-self:flex-end; background:var(--acento); color:#fff }
  .asistente { align-self:flex-start; background:var(--panel); border:1px solid var(--borde) }
  .confirmar { border:2px solid var(--aviso); background:var(--aviso-fondo) }
  .confirmar::before { content:"⚠ Requiere tu confirmación"; display:block; font-weight:600; color:var(--aviso); margin-bottom:6px }
  details.tool { align-self:flex-start; font-size:13px; background:#eef2f7; border-radius:8px; padding:6px 10px; max-width:85% }
  details.tool summary { cursor:pointer }
  details.tool .ok { color:var(--ok) } details.tool .fallo { color:var(--error) }
  details.tool pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0 }
  .pensando { color:var(--suave); font-style:italic }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid var(--borde) }
  textarea { flex:1; resize:none; height:48px; padding:10px; border:1px solid var(--borde); border-radius:8px; font:inherit }
  button { padding:0 16px; border:0; border-radius:8px; background:var(--acento); color:#fff; font-weight:600; cursor:pointer }
  button:disabled { opacity:.5; cursor:default }
  #acciones { display:none; gap:8px; padding:0 16px 12px; background:var(--panel) }
  #acciones.visible { display:flex }
  #acciones .no { background:#475467 }
</style>
</head>
<body>
<header><h1 id="titulo">Asistente administrativo</h1><span id="estado">conectando…</span></header>
<main id="chat"></main>
<div id="acciones"><button id="si">Sí, confirmo</button><button id="no" class="no">No, cancelar</button></div>
<form id="form"><textarea id="entrada" placeholder="Escribe tu solicitud…"></textarea><button id="enviar">Enviar</button></form>
<script>
  const chat = document.getElementById("chat"), entrada = document.getElementById("entrada"), boton = document.getElementById("enviar"), acciones = document.getElementById("acciones")
  let sessionId = crypto.randomUUID()

  fetch("/api/health").then(r => r.json()).then(h => {
    document.getElementById("estado").textContent = `${h.provider} · ${h.model ?? "sin modelo"}`
    if (h.app) { document.getElementById("titulo").textContent = h.app + " · Asistente"; document.title = h.app }
    if (h.ejemplo) entrada.placeholder = "Ej: " + h.ejemplo
  }).catch(() => { document.getElementById("estado").textContent = "sin conexión" })

  function agregar(clase, texto) {
    const div = document.createElement("div")
    div.className = "msg " + clase
    div.textContent = texto
    chat.appendChild(div)
    chat.scrollTop = chat.scrollHeight
    return div
  }

  function mostrarHerramienta(t) {
    const d = document.createElement("details")
    d.className = "tool"
    const s = document.createElement("summary")
    s.innerHTML = `🔧 <b></b> <span class="${t.ok ? "ok" : "fallo"}">${t.ok ? "ok" : "error"}</span>`
    s.querySelector("b").textContent = t.nombre
    const pre = document.createElement("pre")
    pre.textContent = "Argumentos: " + JSON.stringify(t.argumentos) + "\nResultado: " + t.resumen
    d.append(s, pre)
    chat.appendChild(d)
  }

  async function enviar(texto) {
    if (!texto.trim()) return
    agregar("usuario", texto)
    entrada.value = ""; boton.disabled = true; acciones.classList.remove("visible")
    const pensando = agregar("asistente pensando", "Pensando…")
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessionId, message: texto }) })
      const data = await r.json()
      pensando.remove()
      if (!r.ok) { agregar("asistente", "Error: " + (data.error ?? "desconocido")); return }
      sessionId = data.sessionId
      data.toolCalls.forEach(mostrarHerramienta)
      const div = agregar("asistente" + (data.needsConfirmation ? " confirmar" : ""), data.reply || "(sin texto)")
      if (data.needsConfirmation) acciones.classList.add("visible")
    } catch { pensando.remove(); agregar("asistente", "No fue posible contactar el servidor. Intenta de nuevo.") }
    finally { boton.disabled = false; entrada.focus() }
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); enviar(entrada.value) })
  entrada.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(entrada.value) } })
  document.getElementById("si").onclick = () => enviar("Sí, confirmo")
  document.getElementById("no").onclick = () => enviar("No, cancela")
</script>
</body>
</html>
